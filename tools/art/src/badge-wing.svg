<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Gilded Wing: a right-facing dragon wing, root at the left. Greyscale so
       the addon can tint it per classification; mirrored in code for pairs. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d4d4d4"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- membrane -->
  <path d="M 30 150
           C 62 92, 140 40, 234 26
           C 206 60, 214 86, 246 110
           C 206 116, 200 142, 224 178
           C 186 166, 168 188, 172 226
           C 140 198, 102 188, 70 192
           C 54 188, 38 172, 30 150 Z"
        fill="url(#fill)" stroke="#1c1c1c" stroke-width="7" stroke-linejoin="round"/>
  <!-- finger bones -->
  <g stroke="#5a5a5a" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 50 150 Q 150 100, 244 110"/>
    <path d="M 50 152 Q 150 140, 222 176"/>
    <path d="M 50 156 Q 130 170, 170 222"/>
  </g>
  <!-- leading edge (arm) -->
  <path d="M 30 150 C 62 92, 140 40, 234 26 C 150 58, 84 102, 46 158 Z"
        fill="url(#arm)" stroke="#1c1c1c" stroke-width="5" stroke-linejoin="round"/>
  <!-- claw at the wrist -->
  <path d="M 120 66 L 106 38 L 132 60 Z" fill="#ffffff" stroke="#1c1c1c" stroke-width="4" stroke-linejoin="round"/>
  <!-- root knuckle -->
  <circle cx="40" cy="154" r="15" fill="#e6e6e6" stroke="#1c1c1c" stroke-width="5"/>
  <circle cx="36" cy="149" r="5" fill="#ffffff"/>
</svg>
