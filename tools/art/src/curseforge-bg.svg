<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Backdrop for the CurseForge project avatar: the logo is composited over
       this by build-art.py. Full bleed (no border) so CurseForge's rounded
       tile can crop the corners without cutting anything that matters. -->
  <defs>
    <radialGradient id="base" cx="0.5" cy="0.47" r="0.72">
      <stop offset="0" stop-color="#3b1114"/>
      <stop offset="0.55" stop-color="#1d0b0d"/>
      <stop offset="1" stop-color="#0b0607"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f1bd3f" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#f1bd3f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f1bd3f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)"/>
  <!-- Soft gold light behind the emblem. -->
  <ellipse cx="256" cy="256" rx="236" ry="190" fill="url(#glow)"/>
  <!-- Faint rays from the centre, for a little depth. -->
  <g fill="#f6d27a" opacity="0.045">
    <polygon points="256,256 226,0 286,0"/>
    <polygon points="256,256 512,196 512,256"/>
    <polygon points="256,256 286,512 226,512"/>
    <polygon points="256,256 0,256 0,316"/>
    <polygon points="256,256 0,40 40,0"/>
    <polygon points="256,256 472,0 512,40"/>
    <polygon points="256,256 512,472 472,512"/>
    <polygon points="256,256 40,512 0,472"/>
  </g>
</svg>
